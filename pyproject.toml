[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtrack"
version = "0.1.0"
description = "A small command-line tool to track your job applications."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Tuan-Dung Pham" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jobtrack = "jobtrack.cli:main"

[tool.setuptools.packages.find]
include = ["jobtrack*"]
